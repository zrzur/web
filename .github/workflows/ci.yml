name: CI
on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Publication guard and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reviewed public source files
        run: python3 scripts/publication_guard.py
      - name: Secrets in the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range="HEAD~1..HEAD"
          if ! git rev-parse -q --verify "HEAD~1" >/dev/null; then range="HEAD"; fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$BASE..HEAD"; fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --log-opts="$range" --redact --no-banner

  test:
    name: Types, lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zrzur/sdk build
      - run: pnpm --filter solid-livekit-components build
      - run: pnpm --filter client exec node scripts/copyAssets.mjs
      - name: Translations compile
        working-directory: packages/client
        run: pnpm exec lingui compile --typescript
      - name: Translations complete
        working-directory: packages/client
        run: node scripts/check-translations.mjs
      - name: Type check
        working-directory: packages/client
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm exec eslint .
      - name: No native select
        run: |
          # ESLint sees <select>; a styled("select") wrapper needs this search.
          if grep -rnE "<select[ >]|<option[ >]|styled\(\s*[\"']select" packages/client/src packages/client/components --include='*.tsx'; then
            echo "Use FloatingSelect and MenuItem, not a native select." >&2
            exit 1
          fi
      - name: Unit tests
        working-directory: packages/client
        run: pnpm run test:unit
      - name: Component tests
        working-directory: packages/client
        run: pnpm run test:dom
      - name: Media tests
        working-directory: packages/client
        run: pnpm run test:media
      - name: Production build
        working-directory: packages/client
        env:
          VITE_HOST: https://app.zrzur.com
          VITE_API_URL: https://api.zrzur.com
          VITE_INVITE_ORIGIN: https://zrzur.cc
        run: pnpm exec vite build
