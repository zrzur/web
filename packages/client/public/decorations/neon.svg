<svg xmlns="http://www.w3.org/2000/svg" id="play" viewBox="0 0 120 120"><style>.spin,.breathe{transform-origin:60px 60px}@keyframes spin{to{transform:rotate(360deg)}}svg:target .spin{animation:spin 28s linear infinite}@keyframes breathe{50%{opacity:.62}}svg:target .breathe{animation:breathe 4s ease-in-out infinite}</style><defs><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4FA3"/><stop offset="0.5" stop-color="#FF4FA3"/><stop offset="1" stop-color="#4DF0C8"/></linearGradient><filter id="b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2"/></filter></defs><g class="breathe"><circle cx="60" cy="60" r="46" fill="none" stroke="url(#n)" stroke-width="6" filter="url(#b)"/></g><circle cx="60" cy="60" r="46" fill="none" stroke="#1A0F24" stroke-width="5.4" opacity=".45"/><circle cx="60" cy="60" r="46" fill="none" stroke="url(#n)" stroke-width="3.6"/><circle cx="60" cy="60" r="46" fill="none" stroke="#fff" stroke-width="1.2" opacity=".85"/><g class="spin"><circle cx="60" cy="60" r="53" fill="none" stroke="url(#n)" stroke-width="2.4" stroke-dasharray="26 24 8 24" stroke-linecap="round"/></g></svg>