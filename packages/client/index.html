<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Installed on iOS: the page runs under the status bar (black-translucent
       = white clock and icons on our dark frame; #root keeps clear of them
       with the safe-area insets, see components/ui/styles.css) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zrzur">
  <meta name="theme-color" content="#0D0E16">
  <meta name="theme-color" content="#0D0E16" media="(prefers-color-scheme: dark)">
  <meta http-equiv="cache-control" content="no-cache">
  <!-- Zrzur logo B in the action colour, no background, as on zrzur.com (owner, 2026-11-10); ?v= drops cached older icons -->
  <link rel="icon" type="image/svg+xml" href="/assets/web/favicon.svg?v=b-pink-1">
  <link rel="icon" type="image/x-icon" href="/assets/web/icon.ico?v=b-pink-1" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/web/favicon-32.png?v=b-pink-1">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/web/favicon-16.png?v=b-pink-1">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/web/apple-touch-icon.png?v=b-pink-1">
  <title>Zrzur: sign in or create a free account</title>
  <!-- for search engines on the sign-in and sign-up pages; Discover and Designs
       replace this line with their own (public-pages injectHead) -->
  <meta name="description"
    content="Zrzur is a free, open-source home for friends and communities: servers with text and voice channels, screen sharing, files and roles. Sign in or create a free account in your browser.">
</head>

<body>
  <noscript>
    <p>Zrzur is a free, open-source home for friends and communities: servers with text and voice channels, screen
      sharing, files and roles, in your browser and on Windows, macOS and Linux. The app needs JavaScript.
      Learn more at <a href="https://zrzur.com/">zrzur.com</a>.</p>
  </noscript>
  <div id="root"></div>
  <div id="floating"></div>
  <script src="/src/index.tsx" type="module"></script>
</body>

</html>
