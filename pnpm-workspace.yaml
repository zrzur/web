packages:
  - packages/client
  - packages/public-pages
  - packages/stoat.js
  - packages/solid-livekit-components
allowBuilds:
  "@swc/core": true
  core-js: false
  esbuild: true
nodeLinker: isolated

# Override prettier because some of the submodules have ancient prettiers required
# Having multiple prettiers makes the vscode extension unpredictable
# Override solid-js because somewhere from 1.9.6 -> 1.9.14 breaks reactivity
# across dependencies.
overrides:
  "prettier": "^3.8.1"
  "solid-js": "1.9.14"
  # solid-dnd-directive pins an old version
  # newer versions support scrolling ancestors in DOM
  # future todo: drop or fork solid-dnd-directive
  "svelte-dnd-action": "^0.9.79"
  # Security: lift vulnerable transitive versions to the first patched
  # release in the same major (from `pnpm audit`, 2026-10-27)
  "brace-expansion@^1": "^1.1.21"
  "brace-expansion@^2": "^2.1.7"
  "form-data@^4": "^4.0.6"
  "glob@^10": "^10.5.0"
  "body-parser@^2": "^2.4.0"
  "js-yaml@^4": "^4.3.2"
  "mdast-util-to-hast@^13": "^13.2.1"
  "@modelcontextprotocol/sdk@^1": "^1.32.0"
  "qs@^6": "^6.16.1"
  "markdown-it@^14": "^14.3.3"
  "minimatch@^3": "^3.1.4"
  "minimatch@^9": "^9.0.7"
  "minimatch@^10": "^10.2.3"
  "rollup@^4": "^4.59.0"
  "rollup@^3": "^3.30.0"
  "ajv@^6": "^6.14.0"
  "svgo@^3": "^3.3.5"
  "flatted@^3": "^3.4.2"
  "picomatch@^4": "^4.0.4"
  "yaml@^1": "^1.10.3"
  "yaml@^2": "^2.8.3"
  "path-to-regexp@^8": "^8.4.0"
  "lodash@^4": "^4.17.24"
  "postcss@^8": "^8.5.23"
  "ws@^8": "^8.21.0"
  "linkify-it@^5": "^5.0.2"
  "@babel/core@^7": "^7.29.1"
  "nanoid@^3": "^3.3.18"
  "postcss-selector-parser@^7": "^7.1.6"
  "browserslist@^4": "^4.28.7"
  "@humanfs/node@~0.16": "~0.16.8"
  "fast-uri@^3": "^3.1.9"
  "devalue@^5": "^5.9.3"
  "seroval@^1": "^1.6.3"
  "source-map-js@^1": "^1.2.2"
  "proxy-addr@^2": "^2.0.8"
  "tinypool@^2": "^2.1.2"
  "prosemirror-view@^1": "^1.42.3"
  "katex@~0.16": "~0.18.11"
  "vite@^6": "^6.4.4"
  "@vitest/mocker@^5": "^5.0.3"

patchedDependencies:
  livekit-client: patches/livekit-client.patch

strictPeerDependencies: false
